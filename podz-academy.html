<!-- PODz Academy v10 : moteur de la v8 (listes SharePoint, tient après rafraîchissement) + interface épurée de la v4.
     À coller tel quel dans un Web Part Modern Script Editor (site de test).
     Règle : aucun calque plein écran écrit en dur dans la page ; fenêtres, confettis et transitions sont créés par le script, puis retirés. -->
<style>
.podz,.podz *,.podz *::before,.podz *::after{box-sizing:border-box}
.podz{--pod-violet:#C8B5E8;--pod-rose:#F2A8BC;--pod-vert:#A8C4B8;--pod-orange:#F5926A;--pod-jaune:#E8C96A;--pod-bleu:#BDD1FF;--pod-fonce:#002060;--pod-muted:#5A6B8C;--pod-miel:#F2C14E;--pod-ok:#2D6A52;--pod-alerte:#B23A12;--pod-line:rgba(0,32,96,.08);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:var(--pod-fonce);background:#FFFFFF;font-size:14px;line-height:1.5;text-align:left;min-height:100vh}
.podz.pod-fullbleed{width:100vw;max-width:100vw;position:relative;left:50%;margin-left:-50vw}
.podz h1,.podz h2,.podz h3,.podz p{color:var(--pod-fonce);margin:0}
.podz a{cursor:pointer;color:inherit}
.podz button,.podz input,.podz select,.podz textarea{font-family:inherit;color:var(--pod-fonce)}
.podz :focus-visible{outline:3px solid var(--pod-violet);outline-offset:2px}
.podz [hidden]{display:none !important}
.podz .pod-wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
.podz .pod-muted{color:var(--pod-muted)}
.podz .pod-empty{padding:26px 14px;text-align:center;color:var(--pod-muted);font-size:13px;background:#FAFAFD;border:1px dashed rgba(0,32,96,.14);border-radius:14px}
.podz .pod-empty a{font-weight:700}
.podz .pod-demo-note{font-size:11.5px;color:var(--pod-muted);text-align:center;margin-top:30px}
.podz .pod-link-btn{background:none;border:0;padding:0;font-size:11.5px;color:var(--pod-muted);text-decoration:underline;cursor:pointer}

/* Abeilles */
.podz .bee{display:block;width:100%;height:100%;overflow:visible}
.podz .bee .w{transform-box:fill-box;transform-origin:50% 100%}
.podz .bee .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:pod-blink 5s infinite}
.podz .bee-float{animation:pod-float 3.4s ease-in-out infinite}
.podz .pod-flap:hover .bee .w,.podz .bee-flap .bee .w{animation:pod-flap .14s ease-in-out infinite alternate}
@keyframes pod-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pod-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pod-flap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}

/* Barre du haut */
.podz .pod-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--pod-line);box-shadow:0 6px 18px -16px rgba(0,32,96,.4)}
.podz .pod-top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.podz .pod-brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;text-decoration:none;white-space:nowrap}
.podz .pod-brand-bee{width:34px;height:34px}
.podz .pod-nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
@media (max-width:1060px){.podz .pod-nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.podz .pod-nav::-webkit-scrollbar{display:none}}
.podz .pod-nav a{border:1.5px solid #D6D6E0;background:#FFFFFF;padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.podz .pod-nav a:hover{border-color:var(--pod-violet);transform:translateY(-1px)}
.podz .pod-nav a.active{background:var(--pod-violet);border-color:var(--pod-violet)}
.podz .pod-nav a.cta{border-style:dashed}
.podz .pod-nav-count{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--pod-orange);color:#FFFFFF;font-size:10px;font-weight:800;text-align:center;line-height:16px}
.podz .pod-user{display:flex;align-items:center;gap:10px;margin-left:auto}
.podz .pod-user-bee{width:40px;height:40px;flex-shrink:0}
.podz .pod-user-id label{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pod-muted)}
.podz .pod-user-id select{font-size:12.5px;padding:4px 8px;border:1px solid rgba(0,32,96,.18);border-radius:8px;background:#FFFFFF;max-width:220px}
.podz .pod-role{display:inline-block;padding:1px 8px;border-radius:999px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#E6EDFF}
.podz .pod-role.manager{background:var(--pod-jaune)}

/* Fil d'Ariane, titres */
.podz .pod-bc{font-size:13px;color:var(--pod-muted);margin:0 0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.podz .pod-bc a{color:var(--pod-muted);text-decoration:none}
.podz .pod-bc a:hover{color:var(--pod-fonce);text-decoration:underline}
.podz .pod-bc-sep{color:var(--pod-violet);margin:0 4px;font-weight:700}
.podz .pod-bc-current{color:var(--pod-fonce);font-weight:600}
.podz .pod-h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.podz .pod-sub{font-size:13.5px;color:var(--pod-muted);margin:0 0 18px}
.podz .pod-section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:24px 0 10px}
.podz .pod-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.podz .pod-page-head .pod-sub{margin:0}

/* Boutons, champs */
.podz .pod-btn{appearance:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:9px 16px;border-radius:10px;border:1px solid var(--pod-fonce);background:var(--pod-fonce);color:#FFFFFF;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.3;transition:transform .1s,box-shadow .2s}
.podz .pod-btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(0,32,96,.45)}
.podz .pod-btn.ghost{background:#FFFFFF;color:var(--pod-fonce);border-color:rgba(0,32,96,.18)}
.podz .pod-btn.ghost:hover{border-color:var(--pod-fonce)}
.podz .pod-btn.honey{background:var(--pod-miel);border-color:var(--pod-miel);color:var(--pod-fonce)}
.podz .pod-btn.ok{background:#EEF6F2;border-color:#A8C4B8;color:var(--pod-ok)}
.podz .pod-btn.warn{background:#FFFFFF;border-color:rgba(178,58,18,.35);color:var(--pod-alerte)}
.podz .pod-btn.small{font-size:11.5px;padding:5px 10px;border-radius:8px}
.podz .pod-btn.lg{font-size:15px;padding:12px 22px;border-radius:12px}
.podz .pod-btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}
.podz .pod-icon-btn{appearance:none;width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,32,96,.14);background:#FFFFFF;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.podz .pod-icon-btn:hover{border-color:var(--pod-fonce)}
.podz .pod-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.podz input[type=text],.podz input[type=email],.podz input[type=search],.podz input[type=number],.podz input[type=date],.podz select,.podz textarea{font-size:13px;padding:8px 11px;border:1px solid rgba(0,32,96,.16);border-radius:9px;background:#FFFFFF;outline:none;max-width:100%}
.podz input:focus,.podz select:focus,.podz textarea:focus{border-color:var(--pod-violet);box-shadow:0 0 0 3px rgba(200,181,232,.35)}
.podz textarea{width:100%;min-height:80px;resize:vertical}
.podz .pod-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.podz .pod-field label,.podz .pod-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pod-muted)}
.podz .pod-field input,.podz .pod-field select,.podz .pod-field textarea{width:100%}
.podz .pod-form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.podz .pod-select{font-size:12px;padding:5px 8px;border-radius:8px}

/* Pastilles, statuts, progression */
.podz .pod-chip{display:inline-block;padding:3px 10px;background:#F1F3F8;color:var(--pod-muted);font-size:11px;font-weight:600;border-radius:999px;white-space:nowrap}
.podz .pod-chip.oblig{background:var(--pod-orange);color:#FFFFFF;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px}
.podz .pod-chip.certif{background:var(--pod-orange);color:#FFFFFF;font-weight:700}
.podz .pod-chip.assigned{background:#EEF6F2;color:var(--pod-ok);font-weight:700}
.podz .pod-chip.wait{background:#FFF6EC;color:#A3501F;font-weight:700}
.podz .st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.podz .st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.podz .st-afaire{background:#F1F3F8;color:var(--pod-muted)}
.podz .st-encours{background:#FFF6DA;color:#8A6400}
.podz .st-attente{background:#F3EEFB;color:#5B3FA0}
.podz .st-reprendre{background:#FDECEF;color:#B4234A}
.podz .st-terminee{background:#EEF6F2;color:var(--pod-ok)}
.podz .st-retard{background:#FDE3D8;color:var(--pod-alerte)}
.podz .pod-bar{height:8px;background:#EEF0F6;border-radius:999px;overflow:hidden;margin-top:8px}
.podz .pod-bar i{display:block;height:100%;background:linear-gradient(90deg,#F7D774,var(--pod-miel));border-radius:999px;transition:width .4s}
.podz .pod-prog-row{display:flex;align-items:center;gap:10px}
.podz .pod-prog-row b{font-size:12px;min-width:36px;text-align:right}
.podz .pod-hive{display:flex;gap:3px;flex:1;min-width:96px;align-items:center}
.podz .pod-hive .c{position:relative;flex:1;max-width:18px;aspect-ratio:1/1.12;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#EEF0F6;overflow:hidden}
.podz .pod-hive .c i{position:absolute;left:0;top:0;bottom:0;background:var(--pg);display:block}
.podz .pod-anim .pod-hive .c i{animation:pod-fill .5s ease both}
@keyframes pod-fill{from{width:0}}

/* Filtres */
.podz .pod-filter-row{margin-bottom:12px}
.podz .pod-filter-label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;color:var(--pod-muted)}
.podz .pod-pills{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.podz .pod-tag{appearance:none;border:1.5px solid #D6D6E0;background:#FFFFFF;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.podz .pod-tag:hover{border-color:var(--tag-color,var(--pod-violet));transform:translateY(-1px)}
.podz .pod-tag.active{background:var(--tag-color,var(--pod-violet));border-color:var(--tag-color,var(--pod-violet))}
.podz .pod-tag.offre{border-color:var(--tag-color)}
.podz .pod-tag .n{font-weight:800;margin-left:4px;opacity:.6}
.podz .pod-search{width:100%;font-size:14px !important;padding:12px 16px !important;border-radius:12px !important;margin-bottom:14px}
.podz .pod-seg{display:inline-flex;background:#F1F3F8;border-radius:10px;padding:3px;flex-wrap:wrap}
.podz .pod-seg button{appearance:none;border:0;background:transparent;font-size:12px;font-weight:700;color:var(--pod-muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.podz .pod-seg button[aria-pressed="true"],.podz .pod-seg button.active{background:#FFFFFF;color:var(--pod-fonce);box-shadow:0 1px 3px rgba(0,32,96,.15)}
.podz .pod-seg button.s-ok[aria-pressed="true"]{background:#EEF6F2;color:var(--pod-ok)}
.podz .pod-seg[aria-disabled="true"] button{cursor:default;opacity:.6}

/* Panneaux, colonnes */
.podz .pod-panel{background:#FFFFFF;border:1px solid var(--pod-line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.podz .pod-panel.honey{background:linear-gradient(180deg,#FFFBEF,#FFFFFF);border-color:rgba(242,193,78,.35)}
.podz .pod-panel.soft{background:#FBFAFF;border-color:rgba(200,181,232,.45)}
.podz .pod-panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #F0F0F4}
.podz .pod-panel-head h2{font-size:18px;font-weight:700}
.podz .pod-panel-head p,.podz .pod-panel-head small{font-size:12.5px;color:var(--pod-muted)}
.podz .pod-panel-foot{font-size:11.5px;color:var(--pod-muted);margin-top:8px}
.podz .pod-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.podz .pod-cols > div{min-width:0}
@media (max-width:960px){.podz .pod-cols{grid-template-columns:1fr}}

/* Astuce de Pollen */
.podz .pod-coach{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.podz .pod-coach-bee{width:56px;height:56px;flex-shrink:0}
.podz .pod-coach-text{position:relative;flex:1;background:#FFFBEF;border:1px solid rgba(242,193,78,.5);border-radius:14px;padding:10px 38px 10px 14px;font-size:13px}
.podz .pod-coach-text::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:#FFFBEF;border-left:1px solid rgba(242,193,78,.5);border-bottom:1px solid rgba(242,193,78,.5);transform:translateY(-50%) rotate(45deg)}
.podz .pod-coach-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--pod-muted);font-size:13px}

/* Hero */
.podz .pod-hero{background:#FFFFFF;border-radius:22px;padding:22px 24px;margin-bottom:14px;display:flex;gap:22px;align-items:center;border:1px solid rgba(0,32,96,.06);border-left:6px solid var(--ac,var(--pod-violet));box-shadow:0 4px 20px -12px rgba(0,32,96,.15);flex-wrap:wrap;position:relative;overflow:hidden}
.podz .pod-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:radial-gradient(circle,var(--ac,#C8B5E8) 0,transparent 70%);opacity:.22;pointer-events:none}
.podz .pod-hero-bee{width:110px;height:110px;flex-shrink:0}
.podz .pod-hero-text{flex:1;min-width:220px;position:relative;z-index:1}
.podz .pod-hero-tag{display:inline-block;padding:3px 10px;background:var(--ac,var(--pod-violet));font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;margin-bottom:8px}
.podz .pod-hero-title{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em;line-height:1.15}
.podz .pod-hero-desc{font-size:13.5px;color:var(--pod-muted);margin:0;max-width:640px}
.podz .pod-hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;z-index:1}
.podz .pod-valid{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:#EEF6F2;color:var(--pod-ok);white-space:nowrap}
@media (max-width:640px){.podz .pod-hero{padding:16px}.podz .pod-hero-bee{width:80px;height:80px}.podz .pod-hero-side{align-items:flex-start}}

/* Indicateurs */
.podz .pod-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:760px){.podz .pod-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.podz .pod-kpi{background:#FAFAFD;border:1px solid rgba(0,32,96,.05);border-radius:14px;padding:12px 14px}
.podz .pod-kpi-label{font-size:10.5px;color:var(--pod-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.podz .pod-kpi-value{font-size:21px;font-weight:800;line-height:1.2;margin-top:2px}
.podz .pod-kpi-value small{font-size:13px;font-weight:600;color:var(--pod-muted)}
.podz .pod-kpi.alert .pod-kpi-value{color:var(--pod-alerte)}

/* Ruche et badges */
.podz .pod-ruche{display:flex;justify-content:center}
.podz .pod-ruche svg{width:100%;height:auto}
.podz .pod-ruche .hex{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:center}
.podz .pod-ruche .hex:hover{transform:scale(1.06)}
.podz .pod-honey{transform-box:fill-box;transform-origin:50% 100%}
.podz .pod-anim .pod-honey{animation:pod-rise .7s ease both}
@keyframes pod-rise{from{transform:scaleY(0)}}
.podz .pod-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--pod-muted);margin-top:10px}
.podz .pod-legend i{display:inline-block;width:12px;height:13px;margin-right:5px;vertical-align:middle;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.podz .pod-ruche-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
.podz .pod-ruche-cols > div{min-width:0}
@media (max-width:960px){.podz .pod-ruche-cols{grid-template-columns:1fr}}
.podz .pod-badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.podz .pod-badge{text-align:center;font-size:10.5px;font-weight:700;line-height:1.25}
.podz .pod-badge__hex{width:54px;height:60px;margin:0 auto 5px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#FFE79A,#F2C14E);display:flex;align-items:center;justify-content:center;font-size:24px}
.podz .pod-badge.locked .pod-badge__hex{background:#EEF0F6;filter:grayscale(1);opacity:.55}
.podz .pod-badge.locked{color:var(--pod-muted);font-weight:600}
.podz .pod-col-empty{padding:22px 14px;text-align:center;font-size:12.5px;color:var(--pod-muted);border:2px dashed rgba(0,32,96,.1);border-radius:14px}

/* Lignes simples */
.podz .pod-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed rgba(0,32,96,.1)}
.podz .pod-row:last-child{border-bottom:0}
.podz .pod-row-title{font-weight:700;font-size:13px}
.podz .pod-row-title a{text-decoration:none}
.podz .pod-row-title a:hover{text-decoration:underline}
.podz .pod-row-sub{font-size:11.5px;color:var(--pod-muted);margin-top:2px}
.podz .pod-group{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--pod-muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.podz .pod-group:first-child{margin-top:0}
.podz .pod-group::after{content:"";flex:1;height:1px;background:rgba(0,32,96,.08)}

/* Cartes de formation (Ma ruche) */
.podz .pod-card{background:#FFFFFF;border:1px solid var(--pod-line);border-left:4px solid var(--ac,var(--pod-violet));border-radius:0 14px 14px 0;padding:12px 14px;margin-bottom:10px;transition:box-shadow .2s}
.podz .pod-card:hover{box-shadow:0 4px 14px -6px rgba(0,32,96,.18)}
.podz .pod-card.flash,.podz .pod-etape.flash{animation:pod-flash 1.4s ease}
@keyframes pod-flash{25%,60%{box-shadow:0 0 0 4px #F7D774}}
.podz .pod-card-meta{font-size:10px;font-weight:700;color:var(--pod-muted);text-transform:uppercase;letter-spacing:.06em}
.podz .pod-card-title{font-size:14px;font-weight:700;margin:3px 0 2px;line-height:1.3}
.podz .pod-card-due{font-size:12px;color:var(--pod-muted);margin-bottom:8px}
.podz .late{color:var(--pod-alerte);font-weight:700}
.podz .pod-checks{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.podz .pod-check{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:#FAFAFD;border:1px solid rgba(0,32,96,.06)}
.podz .pod-check input{appearance:none;-webkit-appearance:none;margin:0;width:22px;height:22px;flex-shrink:0;border:2px solid rgba(0,32,96,.28);border-radius:7px;background:#FFFFFF;cursor:pointer;display:grid;place-items:center}
.podz .pod-check input:checked{background:var(--pod-miel);border-color:#C9952A}
.podz .pod-check input:checked::after{content:"✓";color:var(--pod-fonce);font-weight:900;font-size:13px;line-height:1}
.podz .pod-check input:disabled{cursor:default;opacity:.75}
.podz .pod-check label{flex:1;min-width:0;font-size:13px;font-weight:600;cursor:pointer}
.podz .pod-check label small{display:block;font-size:11px;font-weight:400;color:var(--pod-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podz .pod-check.done label{color:var(--pod-muted);text-decoration:line-through}

  function splitPipe(s){return String(s||"").split(/\s*\|\s*|\r?\n/).map(function(x){return x.trim();}).filter(Boolean);}
  function splitCsv(s){return String(s||"").split(",").map(function(x){return x.trim();}).filter(Boolean);}
  function pad(n){return (n<10?"0":"")+n;}
  function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function todayIso(){return isoOf(new Date());}
  function addDays(iso, n){var p=iso.split("-"); var d=new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return isoOf(d);}
  function frDate(iso){ if(!iso) return "—"; var p=iso.split("-"); var d=new Date(+p[0], +p[1]-1, +p[2]); return d.toLocaleDateString("fr-FR",{day:"numeric", month:"short", year: (p[0]==String(new Date().getFullYear())?undefined:"numeric")}); }
  function daysUntil(iso){var p=iso.split("-"); var d=new Date(+p[0], +p[1]-1, +p[2]); var t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000);}

  function contrastText(hex){hex=String(hex||"").replace("#",""); if(hex.length!==6) return "#002060"; var r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)/255 > 0.6 ? "#002060" : "#ffffff";}

  function dureeHeures(s){
    var m = String(s||"").replace(",", ".").match(/([\d.]+)\s*(j|h)/i);
    if(!m) return null;
    return m[2].toLowerCase()==="j" ? Number(m[1])*7 : Number(m[1]);

    return fr(Math.round((h/7)*2)/2)+" j";
  }

  function etat(a){

    list.forEach(function(a){
      var e = etat(a); sumPct += e.pct;
      if(e.code==="terminee") r.terminees++; else { if(e.code==="afaire") r.afaire++; else r.encours++; r.restantH += (F[a.fid].heures||0)*(1-e.pct/100); if(!r.next || a.due < r.next.due) r.next = a; }
      if(e.code==="attente") r.attente++;

  // Confettis en alvéoles : créés à la demande puis retirés (rien n'est laissé dans la page).
  function confetti(){
    if(reduceMotion) return;
    var root = document.getElementById("podz"), x = innerWidth / 2, y = innerHeight / 3;
    var cols = ["#F2C14E","#C8B5E8","#A8C4B8","#F2A8BC","#BDD1FF","#F5926A"];
    for(var i=0;i<26;i++){
      var c = document.createElement("span"), an = Math.random() * Math.PI * 2, dd = 60 + Math.random() * 140;
      c.className = "pod-confetti"; c.style.left = x + "px"; c.style.top = y + "px"; c.style.background = cols[i % cols.length];
      c.style.setProperty("--dx", Math.cos(an) * dd + "px"); c.style.setProperty("--dy", Math.sin(an) * dd - 40 + "px"); c.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
      root.appendChild(c);
      setTimeout(function(el){ return function(){ if(el.parentNode) el.parentNode.removeChild(el); }; }(c), 1000);
    }
  }

  // Déclare l'avancement d'une ressource ; fête la fin d'une formation par un vol d'abeille.
  function setModule(a, i, s){
    var before = etat(a).code;
    a.modules[i] = {s:s, date:todayIso()};

    var after = etat(a).code;
    if(after==="terminee" && before!=="terminee"){ flyBee({mini:true, label:"Bravo, formation terminée ! 🐝", slug:"nouveau-podz", color:"#FF9E7A"}); confetti(); }
    else if(after==="attente" && before!=="attente") toast("Formation envoyée à " + user(me().managerId).name + " pour validation.");
    else toast("Avancement enregistré.");

    return {q:q, tries:tries.length, best:tries.reduce(function(m, x){ return Math.max(m, x.score); }, 0), passed:tries.some(function(x){ return x.passed; })};
  }
  // Bouton "Passer le quiz" : seulement pour la personne qui suit la formation, une fois la formation finie.

    if(e.code!=="terminee" && e.code!=="attente") return '<span class="pod-chip">Quiz bonus à la fin</span>';
    var label = !qi.tries ? "🧠 Passer le quiz bonus" : (qi.passed ? "Quiz réussi · meilleur " + qi.best + " %" : "Repasser le quiz · meilleur " + qi.best + " %");

  function quizChip(a){
    var qi = quizInfo(a);

  function renderQuiz(){
    var host = document.getElementById("pod-quiz-host");
    if(!ui.quiz){ host.innerHTML = ""; return; }
    var a = findAttr(ui.quiz.aid), qz = QUIZ[a.fid], res = ui.quiz.result, f = F[a.fid];
    var qs = qz.questions.map(function(q, qi){
      var picked = ui.quiz.answers[qi] || [];
      return '<fieldset class="pod-qitem"><legend><span>Question '+(qi+1)+'/'+qz.questions.length+'</span>'+esc(q.text)+(q.multiple ? ' <em>(plusieurs réponses)</em>' : '')+'</legend>' +
        q.choices.map(function(c, ci){
          var id = "qz-"+qi+"-"+ci, on = picked.indexOf(ci)!==-1, cls = "";
          if(res){ if(q.answers.indexOf(ci)!==-1) cls = " good"; else if(on) cls = " bad"; }
          return '<label class="pod-choice'+cls+'" for="'+id+'"><input id="'+id+'" type="'+(q.multiple ? 'checkbox' : 'radio')+'" name="qz-'+qi+'" data-action="quizAns" data-q="'+qi+'" data-c="'+ci+'"'+(on ? ' checked' : '')+(res ? ' disabled' : '')+'><span>'+esc(c)+'</span></label>';
        }).join("") + '</fieldset>';
    }).join("");
    var foot = res
      ? '<div class="pod-quiz-result '+(res.passed ? 'ok' : 'ko')+'"><b>'+res.score+' %</b><span>'+(res.passed ? 'Bravo, quiz réussi ! 🎓' : 'Pas encore : les bonnes réponses sont en vert. Tu peux réessayer.')+'</span></div>' +
        '<div class="pod-quiz-actions"><button type="button" class="pod-btn ghost" data-action="quizRetry">Recommencer</button><button type="button" class="pod-btn" data-action="quizClose">Fermer</button></div>'
      : '<div class="pod-quiz-actions"><button type="button" class="pod-btn ghost" data-action="quizClose">Plus tard</button><button type="button" class="pod-btn" data-action="quizSubmit">Valider mes réponses</button></div>';
    host.innerHTML = '<div class="pod-quiz-overlay" data-action="quizClose"><div class="pod-quiz" role="dialog" aria-modal="true" aria-labelledby="pod-quiz-title" data-action="noop">' +
      '<div class="pod-quiz-head"><div class="pod-coach-bee">'+beeSvg("#2B3A67", "prof")+'</div><div><div class="pod-quiz-kicker">Quiz bonus · réussi à partir de '+qz.seuil+' %</div><h2 id="pod-quiz-title">'+esc(f.titre)+'</h2></div>' +
      '<button type="button" class="pod-icon-btn" data-action="quizClose" aria-label="Fermer le quiz">✕</button></div>' +
      '<div class="pod-quiz-body">'+qs+'</div>'+foot+'</div></div>';
  }
  function submitQuiz(){
    var a = findAttr(ui.quiz.aid), qz = QUIZ[a.fid], ok = 0, missing = 0;
    qz.questions.forEach(function(q, qi){
      var picked = (ui.quiz.answers[qi] || []).slice().sort().join(",");
      if(!picked) missing++;
      if(picked===q.answers.slice().sort().join(",")) ok++;
    });
    if(missing){ toast("Réponds à toutes les questions avant de valider."); return; }
    var score = Math.round(ok / qz.questions.length * 100), passed = score >= qz.seuil;
    a.quiz = a.quiz || [];
    a.quiz.push({n:a.quiz.length + 1, score:score, date:todayIso(), passed:passed});
    save();
    ui.quiz.result = {score:score, passed:passed};
    renderQuiz();
    if(passed) flyBee({mini:true, label:"Quiz réussi ! 🎓", slug:"prof", color:"#F4C04E"});
  }

  var CUR_ROUTE = "accueil";

    h = String(h || "").replace(/^#/, "") || "accueil";

    // Garde-fou de rôle : les écrans manager ne s'ouvrent pas pour un·e consultant·e.
    if(u.role!=="manager" && ["equipe","consultant","parcours","parcours-edit","nouveau-profil"].indexOf(r.name)!==-1) r = {name:"ma-ruche", arg:""};
    renderNav(r.name);

  /* ---------------------------------------------------------------
     Vue : Nouveau profil (manager) — à partir d'un CV
     Le CV est lu dans le navigateur ; seules les formations choisies sont enregistrées.
     --------------------------------------------------------------- */
  var WIZ_STEPS = ["La personne", "Son CV", "Plan proposé", "Création"];
  var CV_EXEMPLE = "Consultante data, 3 ans d'expérience.\nPower BI (rapports, DAX, Power Query), dashboards, SQL, modélisation en étoile.\nAteliers de recueil des besoins, gestion de projet agile (Scrum), Jira.\nCuriosité pour l'IA générative (ChatGPT, Copilot, prompt engineering).";
  var PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  var PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
  function wizInit(){ return {step:1, form:{nom:"", email:"", profil:"", manager:me().id}, cvNom:"", text:"", found:[], annees:null, picks:{}, groups:[], start:todayIso(), rythme:14, busy:false}; }
  // Les lecteurs PDF et Word ne sont chargés qu'au moment où un CV est déposé.
  function loadScript(src){
    return new Promise(function(res, rej){
      if(document.querySelector('script[src="'+src+'"]')) return res();
      var s = document.createElement("script"); s.src = src; s.onload = res;
      s.onerror = function(){ rej(new Error("lecteur de document bloqué")); };
      document.head.appendChild(s);
    });
  }
  function readCvFile(file){
    var name = String(file.name).toLowerCase();
    if(/\.(txt|md)$/.test(name)) return file.text();
    if(/\.pdf$/.test(name)) return file.arrayBuffer().then(function(buf){
      return loadScript(PDFJS).then(function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise; });
    }).then(function(pdf){
      var pages = [];
      for(var i=1;i<=pdf.numPages;i++) pages.push(pdf.getPage(i).then(function(pg){ return pg.getTextContent(); }).then(function(tc){ return tc.items.map(function(x){ return x.str; }).join(" "); }));
      return Promise.all(pages).then(function(a){ return a.join("\n"); });
    });
    if(/\.docx$/.test(name)) return file.arrayBuffer().then(function(buf){
      return loadScript(MAMMOTH).then(function(){ return window.mammoth.extractRawText({arrayBuffer:buf}); });
    }).then(function(r){ return r.value; });
    return Promise.reject(new Error("format non pris en charge (PDF, Word .docx ou texte)"));
  }
  function cvKey(s){ return " " + norm(s).replace(/[^a-z0-9+#]+/g, " ").trim() + " "; }
  // Compétences repérées = mots-clés (tags) du catalogue présents dans le CV.
  function analyseCv(text){
    var t = cvKey(text), seen = {}, found = [];
    FORMATIONS.forEach(function(f){ f.tags.forEach(function(tag){
      var k = cvKey(tag);
      if(k.length < 4 || seen[k] || t.indexOf(k)===-1) return;
      seen[k] = 1; found.push(tag);
    }); });
    var y = /(\d+) ans? d experience/.exec(t);
    return {found:found, annees:y ? +y[1] : null};
  }
  function proposePlan(w){
    var keys = {}; w.found.forEach(function(t){ keys[cvKey(t)] = 1; });
    function score(f){ return f.tags.filter(function(t){ return keys[cvKey(t)]; }).length; }
    function acquise(f){ return score(f) >= 2 && f.type!=="Certification" && f.niveau!=="Avancé"; }
    var seen = {}; w.groups = [];
    function add(title, items, checked){
      var ids = items.filter(function(f){ return f && !seen[f.id]; }).map(function(f){ seen[f.id] = 1; return f.id; });
      if(!ids.length) return;
      w.groups.push({title:title, ids:ids});
      ids.forEach(function(id){ if(!(id in w.picks)) w.picks[id] = checked(F[id]); });
    }
    add("Socle commun POD", FORMATIONS.filter(function(f){ return f.obligatoire; }), function(){ return true; });
    var prof = PROFILS.filter(function(p){ return p.slug===w.form.profil; })[0];
    if(prof){
      var ids = [];
      S.parcours.filter(function(p){ return p.profil===prof.slug && p.statut==="Actif"; }).forEach(function(p){ p.etapes.forEach(function(e){ ids.push(F[e.fid]); }); });
      add("Parcours du métier « "+prof.name+" »", ids, function(f){ return !acquise(f); });
    }
    add("Pour aller plus loin d'après le CV", FORMATIONS.filter(function(f){ return score(f) >= 1 && !acquise(f); }).sort(function(a, b){ return score(b) - score(a); }).slice(0, 8),
      function(f){ return f.niveau!=="Fondamentaux"; });
    add("Probablement déjà acquises", FORMATIONS.filter(acquise), function(){ return false; });
  }
  function wizPicked(w){
    var out = [];
    w.groups.forEach(function(g){ g.ids.forEach(function(id){ if(w.picks[id] && out.indexOf(id)===-1) out.push(id); }); });
    return out;
  }
  function applyCv(text, nom){
    var w = ui.wiz; if(!w) return;
    var r = analyseCv(text);
    w.found = r.found; w.annees = r.annees; w.cvNom = nom; w.picks = {}; proposePlan(w); w.step = 3; rerender();
    toast(r.found.length ? r.found.length + " compétence(s) repérée(s) dans le CV ✨" : "Aucune compétence repérée : le plan reprend le socle et le métier.");
  }
  function handleCvFile(file){
    toast("Lecture de « " + file.name + " »…");
    readCvFile(file).then(function(text){ applyCv(text, file.name); })

        '<div style="text-align:center"><div class="bee-float bee-flap" style="width:150px;height:150px;margin:0 auto">'+beeSvg(color, fm.profil)+'</div><b>'+esc(fm.nom || "Nouvelle abeille")+'</b><div class="pod-muted" style="font-size:12px">'+esc(prof ? prof.name : "Métier à choisir")+'</div></div></div>' +

    } else if(w.step===2){

    } else if(w.step===3){
      var picked = wizPicked(w), totalH = picked.reduce(function(s, id){ return s + (F[id].heures || 0); }, 0);

        }).join("") +
        '<div class="pod-addf" style="margin-top:12px"><label for="wz-add">Ajouter</label><select id="wz-add"><option value="">Une autre formation du catalogue…</option>' +
          others.map(function(f){ return '<option value="'+esc(f.id)+'">'+esc(f.titre+" ("+f.duree+")")+'</option>'; }).join("") + '</select><button type="button" class="pod-btn small ghost" data-action="wzAdd">+ Ajouter</button></div>' +

    } else {
      var p4 = wizPicked(w), h4 = p4.reduce(function(s, id){ return s + (F[id].heures || 0); }, 0);

    }
    return html + '</div>';
  }

  /* ---------------------------------------------------------------
     Vue : Mes formations (US1 + US2)
     --------------------------------------------------------------- */
  function etapeTrack(a, index, isCurrent, viewer){
    var f = F[a.fid], e = etat(a), ac = offreColor(f.offre);
    var open = OPEN[a.id] ? " open" : "";
    var assigned = user(a.assignedBy).name;
    var head = '<button type="button" class="pod-etape__main track" data-action="toggle" data-id="'+a.id+'" aria-expanded="'+(open?"true":"false")+'">' +
        '<span class="pod-etape__num">'+(e.code==="terminee" ? "✓" : index)+'</span>' +
        '<span class="pod-etape__core"><span class="pod-etape__titre" style="display:block">'+esc(f.titre)+(isCurrent?'<span class="pod-etape__current-flag">Étape en cours</span>':'')+'</span>' +
          '<span class="pod-etape__tags" style="display:block">'+esc(offreLabel(f.offre))+' · '+esc(f.duree)+' · '+dueText(a)+'</span></span>' +
        '<span>'+stChip(a)+'</span>' +
        progBar(e.pct, e.code==="terminee" ? "var(--pod-ok)" : ac) +
        '<span class="pod-etape__chev">▾</span>' +
      '</button>';

    var canEdit = viewer==="consultant" && e.code!=="terminee" && e.code!=="attente";
    var mods = f.liens.map(function(l, i){
      var m = a.modules[i] || {s:"Non commencé"};
      var seg = '<div class="pod-seg" role="group" aria-label="Avancement de la ressource '+(i+1)+'"'+(canEdit?'':' aria-disabled="true"')+'>' +
        MOD_STATUTS.map(function(s){
          return '<button type="button" class="'+(s==="Terminé"?"s-ok":"")+'" data-action="mod" data-id="'+a.id+'" data-i="'+i+'" data-s="'+s+'" aria-pressed="'+(m.s===s)+'"'+(canEdit?'':' disabled')+'>'+s+'</button>';
        }).join("") + '</div>';
      return '<div class="pod-mod"><div class="pod-mod-name">Ressource '+(i+1)+'<small>'+esc(hostLabel(l))+'</small></div>' +
        '<a class="pod-mod-open" href="'+esc(l)+'" target="_blank" rel="noopener">Ouvrir ↗</a>' + seg +
        (m.date && m.s!=="Non commencé" ? '<div class="pod-mod-date">'+esc(m.s)+' · mis à jour le '+frDate(m.date)+'</div>' : '') +
      '</div>';
    }).join("");

    var callout = "";
    if(e.code==="attente") callout = '<div class="pod-callout info">⏳ Tous les modules sont terminés : en attente de validation par '+esc(user(user(a.consultantId).managerId).name)+'.</div>';
    else if(e.code==="reprendre") callout = '<div class="pod-callout warn">↺ Ton manager te demande de reprendre cette formation. Lis son commentaire ci-dessous puis renvoie-la quand c\'est fait.' +
      (viewer==="consultant" ? ' <button class="pod-btn small" data-action="resubmit" data-id="'+a.id+'">Renvoyer pour validation</button>' : '') + '</div>';
    else if(e.code==="terminee") callout = '<div class="pod-callout ok">✓ Formation terminée le '+frDate(a.doneDate)+(a.validated?' · validée par '+esc(user(a.validatedBy).name):'')+'.</div>';
    else if(a.validation==="manager") callout = '<div class="pod-callout info">Cette formation sera validée par ton manager une fois tous les modules terminés.</div>';
    var qb = quizButton(a, viewer);
    if(qb) callout += '<div style="margin:6px 0 12px">'+qb+'</div>';

    var comments = a.comments.map(function(c){
      var u = user(c.by);
      return '<div class="pod-comment'+(u.role==="manager"?" mgr":"")+'"><b>'+esc(u.name)+'</b><span>'+frDate(c.date)+'</span><div>'+esc(c.text)+'</div></div>';
    }).join("");
    var form = '<form class="pod-comment-form" data-action="comment" data-id="'+a.id+'"><label class="sr" for="cm-'+a.id+'" hidden>Commentaire</label><input id="cm-'+a.id+'" name="text" placeholder="'+(viewer==="consultant"?"Une difficulté, une question pour ton manager ?":"Ajouter un commentaire pour le consultant")+'" autocomplete="off"><button class="pod-btn small ghost">Envoyer</button></form>';

    return '<div class="pod-etape'+open+(isCurrent?" current":"")+(e.code==="terminee"?" done":"")+'" style="--ac:'+ac+'" id="et-'+a.id+'">' + head +
      '<div class="pod-etape__detail">' +
        '<div class="pod-mods"><div class="pod-mods-label">'+(viewer==="consultant" ? "Déclare ton avancement · "+e.nDone+"/"+e.n+" terminé(s)" : "Avancement déclaré · "+e.nDone+"/"+e.n+" terminé(s)")+'</div>'+mods+'</div>' +
        callout +
        '<div class="pod-comments">'+comments+'</div>' + form +
        detailInfos(f) +
        '<div class="pod-mini__row" style="font-size:11.5px;color:var(--pod-muted)">Attribuée par '+esc(assigned)+' le '+frDate(a.start)+' · validation : '+(a.validation==="manager"?"manager":"auto-déclaration")+'</div>' +
      '</div></div>';
  }

  function groupByParcours(list){
    var groups = [], idx = {};
    list.forEach(function(a){
      var k = a.parcoursId || "_libre";
      if(!idx[k]){ idx[k] = {key:k, items:[]}; groups.push(idx[k]); }
      idx[k].items.push(a);
    });
    return groups;
  }

  function passFiltre(a, filtre){
    var e = etat(a);
    if(filtre==="afaire") return e.code==="afaire";
    if(filtre==="encours") return e.code==="encours" || e.code==="attente" || e.code==="reprendre";
    if(filtre==="terminee") return e.code==="terminee";
    if(filtre==="retard") return e.late;
    return true;
  }

  function parcoursBlocks(list, viewer, filtre, tri){
    if(tri==="echeance"){
      var flat = list.filter(function(a){ return passFiltre(a, filtre); }).sort(function(a, b){ return a.due < b.due ? -1 : 1; });
      if(!flat.length) return '<div class="pod-empty">Aucune formation dans ce filtre.</div>';
      return '<div class="pod-parcours">' + flat.map(function(a, i){ return etapeTrack(a, i+1, false, viewer); }).join("") + '</div>';
    }
    var html = groupByParcours(list).map(function(g){
      var p = parcoursById(g.key);
      var s = stats(g.items);
      var current = g.items.filter(function(a){ return etat(a).code!=="terminee"; })[0];
      var shown = g.items.map(function(a, i){ return {a:a, i:i+1}; }).filter(function(x){ return passFiltre(x.a, filtre); });
      if(!shown.length) return "";
      var titre = p ? p.titre : "Formations hors parcours";
      var desc = p ? p.description : "Formations attribuées individuellement ou auxquelles tu t'es inscrit·e.";
      return '<div class="pod-parcours"><div class="pod-parcours-head"><div><h2>'+esc(titre)+'</h2><p>'+esc(desc)+'</p></div>' +
        '<div class="pod-parcours-meta">'+(s.total && s.terminees===s.total ? '<span class="pod-diploma">🎓 Diplôme obtenu</span> ' : '')+'<strong>'+s.terminees+'/'+s.total+'</strong> formations terminées'+progBar(s.pct)+'</div></div>' +
        shown.map(function(x){ return etapeTrack(x.a, x.i, current && x.a.id===current.id, viewer); }).join("") +
      '</div>';
    }).join("");
    return html || '<div class="pod-empty">Aucune formation dans ce filtre.</div>';
  }

  /* ---------------------------------------------------------------
     Vue : Mon board (cocher ce qui est fait)
     --------------------------------------------------------------- */
  // Ruche de progression (v4) : une alvéole par formation ; le miel monte avec l'avancement,
  // les terminées d'abord. Coordonnées absolues pour que le zoom au survol reste en place.
  var RUCHE_N = 0;
  function rucheIcon(f){
    if(f.type==="Certification") return "⭐";
    return ({1:"📊", 2:"🤖", 3:"🧭", 4:"🏛️"})[offreNum(f.offre)] || "🐝";
  }
  function hexAt(cx, cy, s){
    var p = [];
    for(var k=0;k<6;k++){ var an = Math.PI/180*(60*k-90); p.push((cx + s*Math.cos(an)).toFixed(1)+","+(cy + s*Math.sin(an)).toFixed(1)); }
    return p.join(" ");
  }
  function rucheSvg(list, cls){
    var order = {terminee:0, encours:1, attente:1, reprendre:1, afaire:2};
    var items = list.filter(function(a){ return F[a.fid]; }).sort(function(a, b){
      return (order[etat(a).code] - order[etat(b).code]) || (a.due < b.due ? -1 : 1);
    });
    if(!items.length) return '<div class="pod-col-empty">Ta ruche est vide pour l\'instant.</div>';
    var n = items.length, cols = Math.min(n, Math.min(7, Math.max(4, Math.ceil(Math.sqrt(n * 1.8)))));
    var r = 30, w = Math.sqrt(3) * r, vs = 1.5 * r, rows = Math.ceil(n / cols), k = ++RUCHE_N, done = 0;
    var W = cols * w + (rows > 1 ? w / 2 : 0) + 8, H = (rows - 1) * vs + 2 * r + 8;
    var cells = items.map(function(a, i){
      var f = F[a.fid], e = etat(a), row = Math.floor(i / cols), col = i % cols;
      var cx = 4 + w / 2 + col * w + (row % 2 ? w / 2 : 0), cy = 4 + r + row * vs, pts = hexAt(cx, cy, r - 2), cid = "rc" + k + "-" + i;
      var isDone = e.code==="terminee", p = isDone ? 1 : (e.code==="afaire" ? 0 : Math.max(.15, e.pct / 100));
      if(isDone) done++;
      var stroke = e.late ? "#E06A6A" : isDone ? "#C9952A" : p ? "#E0B54A" : offreColor(f.offre);
      var label = f.titre + " · " + STATUTS[e.code].label + (!isDone && e.pct ? " (" + e.pct + " %)" : "") + (e.late ? " · en retard" : "");
      return '<g class="hex" data-action="hiveCell" data-id="'+a.id+'"><title>'+esc(label)+'</title>' +
        '<clipPath id="'+cid+'"><polygon points="'+pts+'"/></clipPath>' +
        '<polygon points="'+pts+'" fill="#FFFFFF"/>' +
        (p ? '<rect class="pod-honey" clip-path="url(#'+cid+')" x="'+(cx - r).toFixed(1)+'" y="'+(cy + r - 2 * r * p).toFixed(1)+'" width="'+(2 * r)+'" height="'+(2 * r * p).toFixed(1)+'" fill="url(#rh'+k+')"/>' : '') +
        '<polygon points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="2.5"/>' +
        '<text x="'+cx.toFixed(1)+'" y="'+(cy + 6).toFixed(1)+'" text-anchor="middle" font-size="'+(isDone ? 18 : 16)+'" font-weight="800" fill="#002060">'+(isDone ? "✓" : rucheIcon(f))+'</text></g>';
    }).join("");
    return '<svg class="'+(cls || "")+'" style="max-width:'+Math.round(W * 1.6)+'px" viewBox="0 0 '+W.toFixed(1)+' '+H.toFixed(1)+'" role="img" aria-label="Ruche : '+done+' formation(s) terminée(s) sur '+n+'">' +
      '<defs><linearGradient id="rh'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE79A"/><stop offset="1" stop-color="#F2C14E"/></linearGradient></defs>' +
      cells + '</svg>';
  }
  var RUCHE_LEGEND = '<div class="pod-legend"><span><i style="background:#F2C14E"></i>Terminée</span><span><i style="background:#FFE08A"></i>En cours</span><span><i style="background:#D5DAE3"></i>À faire</span><span><i style="background:#E06A6A"></i>En retard</span></div>';
  function ruchePanel(list, title, foot, action){
    var done = list.filter(function(a){ return etat(a).code==="terminee"; }).length;
    return '<section class="pod-panel honey" aria-label="'+esc(title)+'"><div class="pod-panel-head"><div><h2>'+esc(title)+'</h2><small><b>'+done+'/'+list.length+'</b> alvéoles remplies</small></div>'+(action || '')+'</div>' +
      '<div class="pod-ruche">'+rucheSvg(list)+'</div>' + RUCHE_LEGEND +
      '<div class="pod-panel-foot">'+(foot || "Clique sur une alvéole pour retrouver la formation.")+'</div></section>';
  }
  // Mon board : la même ruche, en plus compact.

  // Badges calculés à partir de l'avancement (rien de plus n'est enregistré).
  function badgesFor(cid){
    var list = attrsOf(cid), done = list.filter(function(a){ return etat(a).code==="terminee"; }), notes = 0;
    list.forEach(function(a){ a.comments.forEach(function(c){ if(c.by===cid) notes++; }); });
    var onTime = done.filter(function(a){ return a.doneDate && a.doneDate <= a.due; }).length;
    var diplome = groupByParcours(list).some(function(g){ return g.key!=="_libre" && g.items.every(function(a){ return etat(a).code==="terminee"; }); });
    return [
      {ico:"🐣", nom:"Premier envol", desc:"Terminer une première formation", ok:done.length >= 1},
      {ico:"🐝", nom:"Butineuse", desc:"Terminer 3 formations", ok:done.length >= 3},
      {ico:"⏰", nom:"Ponctuelle", desc:"Terminer 3 formations avant l'échéance", ok:onTime >= 3},
      {ico:"🏅", nom:"Certifiée", desc:"Terminer une certification", ok:done.some(function(a){ return F[a.fid].type==="Certification"; })},
      {ico:"🧠", nom:"Tête bien faite", desc:"Réussir un quiz bonus", ok:list.some(function(a){ return (a.quiz || []).some(function(x){ return x.passed; }); })},
      {ico:"✍️", nom:"Plume", desc:"Écrire 3 commentaires", ok:notes >= 3},
      {ico:"🎓", nom:"Diplômée", desc:"Terminer un parcours entier", ok:diplome},
      {ico:"🍯", nom:"Ruche pleine", desc:"Terminer toutes ses formations", ok:list.length > 0 && done.length===list.length}
    ];
  }
  function badgesPanel(cid, title){
    var b = badgesFor(cid), nb = b.filter(function(x){ return x.ok; }).length;
    return '<section class="pod-panel" aria-label="'+esc(title)+'"><div class="pod-panel-head"><h2>'+esc(title)+'</h2><small>'+nb+' / '+b.length+' débloqué(s)</small></div><div class="pod-badges">' +
      b.map(function(x){ return '<div class="pod-badge'+(x.ok ? "" : " locked")+'" title="'+esc(x.desc)+'"><div class="pod-badge__hex">'+x.ico+'</div>'+esc(x.nom)+'</div>'; }).join("") + '</div></section>';
  }
  // Couleur et accessoire de l'abeille d'une personne : ceux de son profil PODz s'il en a un.
  function personBee(cid){
    var mp = myProfil(cid), u = user(cid);
    if(mp) return {color:COULEUR_HEX[mp.p.couleur] || u.color, slug:mp.p.slug, tag:mp.p.name};
    return u.role==="manager" ? {color:u.color, slug:"manager", tag:"Manager"} : {color:u.color, slug:"", tag:"PODz"};
  }

  function boardCard(a){
    var f = F[a.fid], e = etat(a), ac = offreColor(f.offre), p = parcoursById(a.parcoursId);
    var canEdit = e.code!=="terminee" && e.code!=="attente";
    var checks = f.liens.map(function(l, i){
      var m = a.modules[i] || {s:"Non commencé"}, done = m.s==="Terminé", idc = "ck-"+a.id+"-"+i;
      return '<li class="pod-check'+(done?" done":"")+'"><input type="checkbox" id="'+idc+'" data-action="check" data-id="'+a.id+'" data-i="'+i+'"'+(done?" checked":"")+(canEdit?"":" disabled")+'>' +
        '<label for="'+idc+'">Ressource '+(i+1)+(m.s==="En cours"?' <span class="pod-chip">en cours</span>':'')+'<small>'+esc(hostLabel(l))+'</small></label>' +
        '<a href="'+esc(l)+'" target="_blank" rel="noopener" aria-label="Ouvrir la ressource '+(i+1)+' de '+esc(f.titre)+'">Ouvrir ↗</a></li>';
    }).join("");
    var foot = "";
    if(e.code==="afaire") foot = '<button class="pod-btn small" data-action="start" data-id="'+a.id+'">▶ Je commence</button>';
    else if(e.code==="reprendre"){
      var mc = a.comments.filter(function(c){ return user(c.by).role==="manager"; }).slice(-1)[0];
      foot = '<div class="pod-callout warn" style="margin:0;width:100%">↺ À reprendre'+(mc?' : « '+esc(mc.text)+' »':'')+'</div><button class="pod-btn small" data-action="resubmit" data-id="'+a.id+'">Renvoyer pour validation</button>';
    }

  function exportCsv(){
    var u = me(), lines = [ ["Consultant","Parcours","ID","Formation","Statut","En retard","Avancement %","Attribuée le","Échéance","Terminée le","Dernier commentaire"] ];
    team(u.id).forEach(function(c){
      attrsOf(c.id).forEach(function(a){
        var e = etat(a), p = parcoursById(a.parcoursId), last = a.comments.slice(-1)[0];
        lines.push([c.name, p ? p.titre : "Hors parcours", a.fid, F[a.fid].titre, STATUTS[e.code].label, e.late ? "Oui" : "Non", e.pct, a.start, a.due, a.doneDate||"", last ? last.text : ""]);
      });
    });
    var csv = "\uFEFF" + lines.map(function(l){ return l.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(";"); }).join("\r\n");
    var blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob); link.download = "suivi-equipe-podz-" + todayIso() + ".csv";
    document.body.appendChild(link); link.click(); link.remove();
    toast("Export du suivi d'équipe téléchargé (ouvrable dans Excel).");
  }

      return;
    }
    // Dans SharePoint, les liens internes (#…) changent d'écran sans modifier l'adresse de la page.

      ev.preventDefault();
      var ha = hl.getAttribute("data-action"), hid = hl.getAttribute("data-id");

  // Chiffres des indicateurs qui défilent de 0 à leur valeur.
  function countUp(){
    if(reduceMotion) return;
    [].forEach.call(main.querySelectorAll(".pod-kpi-value"), function(el){
      var node = el.firstChild;
      var m = node && node.nodeType===3 ? node.nodeValue.match(/^(\d+)(%?)(\s*)$/) : null;
      if(!m || +m[1]===0) return;
      var target = +m[1], t0 = null;
      function step(ts){
        if(!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / 650);
        node.nodeValue = Math.round(target * (1 - Math.pow(1 - p, 3))) + m[2] + m[3];
        if(p < 1) requestAnimationFrame(step);
      }
      node.nodeValue = "0" + m[2] + m[3];
      requestAnimationFrame(step);
    });
  }

  // Mon board : déplacer une carte d'une colonne à l'autre met à jour l'avancement.
  function moveCard(a, to){
    if(!a) return;
    var before = etat(a);
    if(before.code==="attente" || a.validated){ toast("Formation validée ou en attente de validation : elle ne peut plus être déplacée."); return; }
    var n = Math.max(F[a.fid].liens.length, 1), d = todayIso(), i;
    if(to==="afaire") a.modules = {};
    else if(to==="encours"){
      var started = Object.keys(a.modules).some(function(k){ return a.modules[k].s!=="Non commencé"; });
      if(!started) a.modules[0] = {s:"En cours", date:d};
      else if(before.nDone===n) a.modules[n-1] = {s:"En cours", date:d};
    }
    else if(to==="fini"){ for(i=0;i<n;i++) a.modules[i] = {s:"Terminé", date:d}; }
    syncDone(a); save(); rerender();
    var after = etat(a).code;
    if(after==="terminee" && before.code!=="terminee"){ flyBee({mini:true, label:"Bravo, formation terminée ! 🐝", slug:"nouveau-podz", color:"#FF9E7A"}); confetti(); }
    else if(after==="attente" && before.code!=="attente") toast("Formation envoyée à " + user(me().managerId).name + " pour validation.");
    else if(after!==before.code) toast("Carte déplacée.");
  }

  PODZ_ROOT.addEventListener("submit", function(ev){
    var form = ev.target, act = form.getAttribute("data-action"), id = form.getAttribute("data-id");
    if(!act) return;
    ev.preventDefault();
    if(act==="comment"){
      var text = form.text.value.trim(); if(!text) return;
      var a = findAttr(id); a.comments.push({by:me().id, date:todayIso(), text:text}); OPEN[id] = true;
      save(); rerender(); toast("Commentaire envoyé.");
    }
    if(act==="reprendre"){
      var t = form.text.value.trim(); if(!t) return;
      var b = findAttr(id); b.aReprendre = true; b.validated = false; b.comments.push({by:me().id, date:todayIso(), text:t});
      ui.reprendreOpen = null; syncDone(b); save(); rerender(); toast("Formation renvoyée « À reprendre ».");
    }
    if(act==="addFormation"){
      var afid = form.fid.value, adue = form.due.value;
      if(!afid || !adue) return;
      S.attributions.push(newAttribution(id, afid, {due:adue, by:me().id}));
      save(); rerender(); toast("« " + F[afid].titre + " » ajoutée pour " + user(id).name + ".");
      return;

      var p = parcoursById(id), start = form.start.value, people = [].slice.call(form.querySelectorAll("input[name=c]:checked")).map(function(x){ return x.value; });
      if(!people.length){ toast("Sélectionne au moins un consultant."); return; }
      // Règle clé : une attribution par formation du parcours, échéance calculée ; le modèle peut évoluer ensuite sans les modifier.
      people.forEach(function(cid){
        p.etapes.forEach(function(e){ S.attributions.push(newAttribution(cid, e.fid, {parcoursId:p.id, start:start, delai:e.delai, validation:e.validation, by:me().id})); });
      });
      ui.assignOpen = null; save(); rerender();
      toast("« " + p.titre + " » attribué à " + people.map(function(x){ return user(x).name; }).join(", ") + ".");
    }
  });

      S.profils = S.profils || {};

  var SP_WEB = (window._spPageContextInfo && window._spPageContextInfo.webAbsoluteUrl) ||

  function listPath(key){ return "/_api/web/lists/getbytitle('" + encodeURIComponent(LISTS[key].replace(/'/g, "''")) + "')"; }
  function getDigest(){
    if(spDigest && Date.now() - spDigestAt < 20*60*1000) return Promise.resolve(spDigest);
    return fetch(SP_WEB + "/_api/contextinfo", {method:"POST", headers:{"Accept":"application/json;odata=nometadata"}, credentials:"same-origin"})
      .then(function(r){ return r.json(); })
      .then(function(j){ spDigest = j.FormDigestValue; spDigestAt = Date.now(); return spDigest; });

  function spFetch(path, o){
    o = o || {};

      ready = getDigest().then(function(d){
        headers["X-RequestDigest"] = d; headers["Content-Type"] = "application/json;odata=nometadata";
        if(o.merge){ headers["IF-MATCH"] = "*"; headers["X-HTTP-Method"] = "MERGE"; }
      });
    }
    return ready.then(function(){
      return fetch(SP_WEB + path, {method:o.method||"GET", headers:headers, body:o.body ? JSON.stringify(o.body) : undefined, credentials:"same-origin"});
    }).then(function(r){
      return r.text().then(function(t){
        if(!r.ok){ var m = t.match(/"value"\s*:\s*"([^"]+)"/) || t.match(/"message"\s*:\s*"([^"]+)"/); throw new Error(r.status + " · " + (m ? m[1] : t.slice(0, 160))); }
        return t ? JSON.parse(t) : null;

    });
  }

  // Listes "maison" de POD (mêmes noms et colonnes que sur le site POD), lues si elles existent sur le site.
  var POD_LISTS = {formations:"Liste_formation_Pod", profils:"Profils", parcours:"Parcours"};
  // Cherche la liste par son titre puis par son adresse (/Lists/…), sous son nom exact puis avec le suffixe "_Test".
  function optItems(title){
    var webPath = SP_WEB.replace(/^https?:\/\/[^\/]+/, "");
    var tries = [];
    [title, title + "_Test"].forEach(function(t){
      tries.push("/_api/web/lists/getbytitle('" + encodeURIComponent(t.replace(/'/g, "''")) + "')/items?$top=5000");
      tries.push("/_api/web/GetList('" + encodeURIComponent((webPath + "/Lists/" + t).replace(/'/g, "''")) + "')/items?$top=5000");
    });
    function next(i){
      if(i >= tries.length) return Promise.resolve(null);
      return spFetch(tries[i]).then(function(j){ return j.value; }).catch(function(){ return next(i + 1); });
    }
    return next(0);
  }
  function pick(c, names){ for(var i=0;i<names.length;i++){ var v = c[names[i] ]; if(v != null && v !== "") return v; } return ""; }
  function asArr(v){
    if(v == null || v === "") return [];
    if(Array.isArray(v)) return v;
    if(v.results) return v.results;
    return String(v).split(/;#|\s*;\s*/).filter(Boolean);
  }
  // Liste_formation_Pod : Title, field_2 type, field_3 offre, field_4 bucket, field_5 niveau, field_6 durée (texte),
  // DureeHeures, field_7 liens, field_8 tags, field_9 plateforme, field_10/Obligatoire, field_11 notes, Parcours, Ordre.
  function mapPodFormation(c){
    return {id:"LF" + (c.Id || c.ID), titre:c.Title || "(sans titre)", type:pick(c, ["field_2","TypeFormation","Type"]),
      offre:pick(c, ["field_3","Offre"]) || "Transverse", bucket:pick(c, ["field_4","Bucket"]), niveau:pick(c, ["field_5","Niveau"]),
      duree:pick(c, ["field_6","Duree"]), heures:c.DureeHeures, liens:pick(c, ["field_7","Liens"]), tags:pick(c, ["field_8","Tags","TagsSkills"]),
      plateforme:asArr(c.field_9 || c.Plateforme).join(" · "),
      obligatoire:(c.Obligatoire === true || /^oui$/i.test(String(c.field_10 || "").trim())) ? "Oui" : "Non",
      notes:pick(c, ["field_11","Notes"]), parcours:asArr(c.Parcours), ordre:c.Ordre};
  }
  // Profils : Title, Slug, Tag, SousTitre, Description, Couleur, PageDepart, Ordre (les abeilles restent celles de la page).
  function mapPodProfils(rows){
    function couleurKey(c){
      var k = norm(c);
      for(var name in COULEUR_HEX){ if(norm(name)===k) return name; }
      return "Violet";
    }
    return rows.map(function(r){
      return {slug:r.Slug || norm(r.Title).replace(/[^a-z0-9]+/g, "-"), name:r.Title, tag:r.Tag || "", job:r.SousTitre || "",
        heroDesc:r.Description || r.SousTitre || "", couleur:couleurKey(r.Couleur), pageDepart:!!r.PageDepart,
        ordre:(r.Ordre != null && r.Ordre !== "") ? Number(r.Ordre) : 9999};
    }).sort(function(a, b){ return a.ordre - b.ordre; });
  }
  // Parcours : Title, Description, Profils, Ordre. Les étapes sont les formations dont la colonne "Parcours"
  // contient ce titre, triées par "Ordre" ; délai par défaut J+7 par étape, certification validée par le manager.
  function mapPodParcours(rows){
    return rows.slice().sort(function(a, b){ return (Number(a.Ordre) || 9999) - (Number(b.Ordre) || 9999); }).map(function(r){
      var members = FORMATIONS.filter(function(f){ return f.parcoursTitres.some(function(t){ return norm(t)===norm(r.Title); }); })
        .sort(function(a, b){ return a.ordre - b.ordre; });
      return {id:"LP" + (r.Id || r.ID), titre:r.Title, description:r.Description || "", profil:asArr(r.Profils)[0] || "", statut:"Actif", owner:"",
        etapes:members.map(function(f, i){ return {fid:f.id, delai:7*(i+1), validation:f.type==="Certification" ? "manager" : "auto"}; })};
    }).filter(function(p){ return p.etapes.length; });
  }
  // Retrouve une formation même si son identifiant a changé (ex. F001 de l'Excel -> élément de Liste_formation_Pod), via le titre.
  function remapFid(fid){
    if(F[fid]) return fid;
    var t = EMB_TITLES[fid];
    if(!t) return null;
    var hit = FORMATIONS.filter(function(f){ return norm(f.titre)===norm(t); })[0];
    return hit ? hit.id : null;
  }
  function norm(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase(); }
  // Exécute fn sur chaque élément, par paquets, pour ne pas saturer SharePoint.
  function inBatches(list, size, fn, onStep){

      var chunk = list.slice(i, i + size); i += size;
      return Promise.all(chunk.map(fn)).then(function(){ if(onStep) onStep(Math.min(i, list.length), list.length); return next(); });
    }
    return next();
  }

  // Objet de l'appli -> ligne de liste SharePoint.
  function attrToItem(a){

      DateDebut:a.start, Echeance:a.due, Validation:a.validation, AttribuePar:a.assignedBy||"", Modules:JSON.stringify(a.quiz && a.quiz.length ? Object.assign({}, a.modules, {_quiz:a.quiz}) : (a.modules||{})),
      Validee:!!a.validated, ValideePar:a.validatedBy||"", AReprendre:!!a.aReprendre, Commentaires:JSON.stringify(a.comments||[]),
      DateFin:a.doneDate||"", Annulee:!!a.cancelled, MotifAnnulation:a.cancelReason||""};
  }
  function parcToItem(p){
    return {Title:p.titre, ParcoursId:p.id, Description:p.description||"", Profil:p.profil||"", Statut:p.statut||"Brouillon", Etapes:JSON.stringify(p.etapes||[]), Proprietaire:p.owner||""};

  // Envoie à SharePoint uniquement ce qui a changé depuis la dernière synchro (une écriture à la fois).
  function spSave(){
    spQueue = spQueue.then(function(){
      var jobs = [];
      S.attributions.forEach(function(a){
        var j = JSON.stringify(a); if(spSnap.attr[a.id]===j) return;
        jobs.push((a.spId ? spUpdate("attr", a.spId, attrToItem(a)) : spCreate("attr", attrToItem(a)).then(function(it){ a.spId = it.Id; }))
          .then(function(){ spSnap.attr[a.id] = JSON.stringify(a); }));
      });
      S.parcours.forEach(function(p){
        var j = JSON.stringify(p); if(spSnap.parc[p.id]===j) return;
        jobs.push((p.spId ? spUpdate("parc", p.spId, parcToItem(p)) : spCreate("parc", parcToItem(p)).then(function(it){ p.spId = it.Id; }))
          .then(function(){ spSnap.parc[p.id] = JSON.stringify(p); }));
      });
      USERS.forEach(function(u){
        var pr = S.profils[u.id] || null, j = JSON.stringify(pr); if(spSnap.prof[u.id]===j || !u.spId) return;
        jobs.push(spUpdate("team", u.spId, {Profil:pr ? pr.slug : "", ProfilPar:pr ? pr.by : "", ProfilDate:pr ? pr.date : ""})
          .then(function(){ spSnap.prof[u.id] = j; }));

  // Crée une liste "PODz …" et ses colonnes (sans erreur si elles existent déjà).
  function ensureList(k, say){
    say = say || function(){};
    say("Création de la liste « " + LISTS[k] + " »…");
    return spFetch("/_api/web/lists", {method:"POST", body:{Title:LISTS[k], BaseTemplate:100, Description:"PODz Academy"}})
      .catch(function(e){ if(!/exist|existe/i.test(e.message)) throw e; })
      .then(function(){
        return inBatches(SP_FIELDS[k], 1, function(fd){
          var xml = '<Field Type="'+fd[1]+'" Name="'+fd[0]+'" StaticName="'+fd[0]+'" DisplayName="'+fd[0]+'"' +
            (fd[1]==="Note" ? ' NumLines="6" RichText="FALSE"' : '') + (fd[1]==="Text" ? ' MaxLength="255"' : '') +
            (fd[1]==="Boolean" ? '><Default>0</Default></Field>' : '/>');
          return spFetch(listPath(k) + "/fields/CreateFieldAsXml", {method:"POST", body:{parameters:{SchemaXml:xml, Options:24}}})
            .catch(function(e){ if(!/duplicate|existe|exist/i.test(e.message)) throw e; });

      if(j.value.length) return;
      return inBatches(DEMO_QUIZ.map(function(r, i){ return {r:r, i:i}; }), 5, function(x){

  function spInstall(withDemo){
    var log = document.getElementById("pod-install-log");
    function say(t){ if(log) log.textContent = t; }
    var keys = ["cat","team","parc","attr","quiz"];
    var chain = Promise.resolve();
    keys.forEach(function(k){ chain = chain.then(function(){ return ensureList(k, say); }); });
    // Remplissage, uniquement des listes encore vides (on peut relancer sans créer de doublons).
    chain = chain.then(function(){ return Promise.all(keys.map(function(k){ return spFetch(listPath(k) + "/items?$top=1&$select=Id"); })); })
    .then(function(res){
      var empty = {}; keys.forEach(function(k, i){ empty[k] = !res[i].value.length; });
      var steps = Promise.resolve();
      if(empty.cat) steps = steps.then(function(){
        return inBatches(CATALOGUE, 5, function(r){
          return spCreate("cat", {Title:r.titre, FormationId:r.id, TypeFormation:r.type, Offre:r.offre, Bucket:r.bucket, Niveau:r.niveau, Duree:r.duree,
            Liens:splitPipe(r.liens).join("\n"), Tags:r.tags, Plateforme:r.plateforme, Obligatoire:String(r.obligatoire).toLowerCase()==="oui", Notes:splitPipe(r.notes).join("\n")});
        }, function(i, n){ say("Catalogue : " + i + "/" + n + " formations"); });
      });
      if(empty.quiz) steps = steps.then(function(){ return seedQuiz(say); });
      if(!withDemo) return steps;
      // Données de démo : reprises du mode local, en remplaçant les identifiants par les noms des personnes.
      var demo = seed(), name = {};
      USERS.forEach(function(u){ name[u.id] = u.name; });
      function nm(id){ return name[id] || id || ""; }
      if(empty.team) steps = steps.then(function(){
        return inBatches(USERS, 3, function(u){
          var pr = demo.profils[u.id];
          return spCreate("team", {Title:u.name, Role:u.role, Manager:u.managerId ? nm(u.managerId) : "", Email:"", Couleur:u.color,
            Profil:pr ? pr.slug : "", ProfilPar:pr ? nm(pr.by) : "", ProfilDate:pr ? pr.date : ""});
        }, function(i, n){ say("Équipe : " + i + "/" + n + " personnes"); });
      });
      if(empty.parc) steps = steps.then(function(){
        return inBatches(demo.parcours, 3, function(p){ p.owner = nm(p.owner); return spCreate("parc", parcToItem(p)); }, function(i, n){ say("Parcours : " + i + "/" + n); });
      });

        return inBatches(demo.attributions, 5, function(a){

          a.comments.forEach(function(c){ c.by = nm(c.by); });
          return spCreate("attr", attrToItem(a));
        }, function(i, n){ say("Avancement de démo : " + i + "/" + n); });
      });
      return steps;
    });
    return chain;
  }

  // Démarrage sur SharePoint : vérifie les listes, charge les données, reconnaît la personne connectée.
  function spBoot(){
    main.innerHTML = '<div class="pod-empty">Chargement de PODz Academy depuis SharePoint…</div>';
    Promise.all([
      spFetch("/_api/web/currentuser?$select=Title,Email,IsSiteAdmin"),
      spFetch("/_api/web/lists?$select=Title&$filter=startswith(Title,'PODz ')"),
      spFetch("/_api/web/effectiveBasePermissions")
    ]).then(function(res){
      var me0 = res[0], titles = res[1].value.map(function(l){ return l.Title; });
      // "Gérer les listes" (ManageLists, bit 12 des droits SharePoint) suffit pour installer et prévisualiser.
      var canManageLists = ((Number(res[2].Low) >>> 11) & 1) === 1;
      SP_ADMIN = !!me0.IsSiteAdmin || canManageLists;
      // "PODz Catalogue" est facultative : le catalogue vient d'abord de "Liste_formation_Pod".
      var missing = Object.keys(LISTS).filter(function(k){ return k!=="cat" && k!=="quiz" && titles.indexOf(LISTS[k])===-1; });
      SP_QUIZ_MISSING = titles.indexOf(LISTS.quiz)===-1;
      if(missing.length){ spMessage("Installer PODz Academy sur ce site", viewInstall(missing)); return; }
      return Promise.all([optItems(POD_LISTS.formations), optItems(LISTS.cat), spItems("team"), spItems("parc"), spItems("attr"),
                          optItems(POD_LISTS.profils), optItems(POD_LISTS.parcours), SP_QUIZ_MISSING ? Promise.resolve(null) : optItems(LISTS.quiz)]).then(function(r){
        var lf = r[0], cat = r[1], tm = r[2], pc = r[3], at = r[4], prof = r[5], lp = r[6], qz = r[7];
        if(lf && lf.length) buildFormations(lf.map(mapPodFormation));
        else if(cat && cat.length) buildFormations(cat.map(function(c){
          return {id:c.FormationId, titre:c.Title, type:c.TypeFormation, offre:c.Offre, bucket:c.Bucket, niveau:c.Niveau, duree:c.Duree,
            liens:c.Liens, tags:c.Tags, plateforme:c.Plateforme, obligatoire:c.Obligatoire ? "Oui" : "Non", notes:c.Notes};
        }));
        if(prof && prof.length) PROFILS = mapPodProfils(prof);
        // Quiz : liste "PODz Quiz" si elle contient des questions, sinon les exemples intégrés.
        buildQuiz(qz && qz.length ? qz.map(function(x){
          return {formation:x.Formation, question:x.Title, choix:x.Choix, reponses:x.Reponses, seuil:x.Seuil, ordre:x.Ordre};
        }) : DEMO_QUIZ);
        var byName = {}; tm.forEach(function(t){ byName[norm(t.Title)] = t.Title; });
        USERS = tm.map(function(t){
          var role = norm(t.Role)==="manager" ? "manager" : "consultant";
          return {id:t.Title, name:t.Title, role:role, managerId:t.Manager ? (byName[norm(t.Manager)] || t.Manager) : null,
            title:role==="manager" ? "Manager" : "Consultant·e", color:t.Couleur || "#B7A4EC", email:t.Email || "", spId:t.Id};
        });
        var profils = {};
        tm.forEach(function(t){ if(t.Profil) profils[t.Title] = {slug:t.Profil, by:t.ProfilPar || "", date:t.ProfilDate || ""}; });
        var parcours = pc.map(function(p){
          return {id:p.ParcoursId, titre:p.Title, description:p.Description || "", profil:p.Profil || "", statut:p.Statut || "Brouillon",
            owner:p.Proprietaire || "", spId:p.Id,
            etapes:parseJson(p.Etapes, []).map(function(e){ e.fid = remapFid(e.fid); return e; }).filter(function(e){ return e.fid; })};
        });
        // Parcours de la liste "Parcours" : ajoutés sauf s'ils ont déjà une version modifiée dans "PODz Parcours".
        if(lp && lp.length) mapPodParcours(lp).forEach(function(x){
          var dup = parcours.filter(function(p){ return p.id===x.id || norm(p.titre)===norm(x.titre); })[0];
          if(!dup) parcours.push(x);
        });
        var attributions = at.map(function(a){
          return {id:a.AttributionId, consultantId:a.Consultant, fid:a.FormationId, parcoursId:a.ParcoursId || null, start:a.DateDebut, due:a.Echeance,
            validation:a.Validation || "auto", assignedBy:a.AttribuePar || "", modules:parseJson(a.Modules, {}), validated:!!a.Validee,
            validatedBy:a.ValideePar || null, aReprendre:!!a.AReprendre, comments:parseJson(a.Commentaires, []), doneDate:a.DateFin || null,
            cancelled:!!a.Annulee, cancelReason:a.MotifAnnulation || "", spId:a.Id};
        }).map(function(a){
          // Les tentatives de quiz sont rangées dans la colonne Modules, sous la clé "_quiz".
          a.quiz = (a.modules && a.modules._quiz) || [];
          if(a.modules) delete a.modules._quiz;
          a.fid = remapFid(a.fid); return a;
        }).filter(function(a){ return a.fid; });
        // La personne connectée est retrouvée dans "PODz Equipe" par son e-mail, sinon par son nom.
        var mine = USERS.filter(function(u){ return u.email && norm(u.email)===norm(me0.Email); })[0] ||
                   USERS.filter(function(u){ return norm(u.name)===norm(me0.Title); })[0];
        if(!mine && !SP_ADMIN){
          spMessage("Bienvenue " + esc(me0.Title) + " !", '<p class="pod-home-sub">Tu n\'es pas encore inscrit·e dans la liste <b>PODz Equipe</b>. Demande à ton manager ou à l\'équipe RH de t\'ajouter.</p>');
          return;
        }
        if(!USERS.length){ spMessage("La liste PODz Equipe est vide", '<p class="pod-home-sub">Ajoute au moins un manager et un·e consultant·e dans la liste <b>PODz Equipe</b> du site.</p>'); return; }
        S = {version:2, currentUser:(mine || USERS[0]).id, parcours:parcours, attributions:attributions, profils:profils};
        userSel.parentNode.hidden = false;
        snapshot(); render();
      });
    }).catch(function(err){
      spMessage("Connexion à SharePoint impossible", '<p class="pod-home-sub">'+esc(err.message)+'</p>');
    });
  }

  if(SP_MODE){ PODZ_ROOT.classList.add("pod-fullbleed"); spBoot(); } else render();
})();
</script>
